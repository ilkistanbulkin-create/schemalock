openapi: 3.0.3
info:
  title: Sample API
  version: 1.0.0
paths:
  /users:
    get:
      summary: List users
      responses:
        "200":
          description: OK
    post:
      summary: Create a user
      responses:
        "201":
          description: Created
  /posts:
    get:
      summary: List posts
      responses:
        "200":
          description: OK
    delete:
      summary: Delete a post
      responses:
        "204":
          description: Deleted
components:
  schemas:
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
    Post:
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
        title:
          type: string
        published:
          type: boolean
        author:
          $ref: "#/components/schemas/User"
